<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Números Primos
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="presentacion">
    <h2>Contador de Números Primos</h2>
    <p>Estudiante: <strong>Ariel Arias</strong></p>
  </div>

  <ion-card color="primary">
    <ion-card-header>
      <ion-card-title>Contador</ion-card-title>
    </ion-card-header>

    <ion-card-content class="contador">
      <h1>{{ primoActual }}</h1>

      <p>
        Números primos contados:
        <strong>{{ contador }}</strong>
      </p>

      <ion-button
        expand="block"
        color="light"
        (click)="siguientePrimo()">
        Número primo
      </ion-button>

      <ion-button
        expand="block"
        color="medium"
        (click)="reiniciar()">
        Reiniciar
      </ion-button>
    </ion-card-content>
  </ion-card>

</ion-content>
